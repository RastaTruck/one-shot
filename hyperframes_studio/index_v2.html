<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1242, height=1668" />
<!-- 字体：异步加载，font-display:swap 让 system fallback 立即接管，防 Playwright 卡 networkidle -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Oswald:wght@600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!-- GSAP 本地化（feedback_china-cdn-no-trust：jsdelivr 国内不稳） -->
<script src="vendor/gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1242px;
    height: 1668px;
    overflow: hidden;
    background: transparent;
  }

  /* 整体 chyron 容器 */
  #chyron {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 367px;
    will-change: transform;
  }

  /* 顶部 hairline 金线（扫过动画） */
  .hairline {
    position: absolute;
    left: 0; top: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, #E8C97A 20%, #FFE9A8 50%, #E8C97A 80%, transparent 100%);
    transform-origin: left center;
  }

  /* 副条：深黑底 */
  .sub-bar {
    position: absolute;
    left: 0; right: 0; top: 3px;
    height: 162px;
    background: linear-gradient(180deg, #0A0E1A 0%, #131826 100%);
    border-bottom: 2px solid #C8A654;
  }
  /* 全程流光 - sub-bar */
  .gloss-sub {
    position: absolute;
    left: 0; top: 3px;
    width: 100%; height: 162px;
    background: linear-gradient(105deg,
      transparent 35%,
      rgba(200,166,84,0.16) 47%,
      rgba(255,224,138,0.30) 50%,
      rgba(200,166,84,0.16) 53%,
      transparent 65%);
    background-size: 220% 100%;
    pointer-events: none;
    mix-blend-mode: screen;
    will-change: background-position;
  }
  /* 全程流光 - main-bar */
  .gloss-main {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 200px;
    background: linear-gradient(105deg,
      transparent 30%,
      rgba(200,166,84,0.20) 47%,
      rgba(255,224,138,0.38) 50%,
      rgba(200,166,84,0.20) 53%,
      transparent 70%);
    background-size: 240% 100%;
    pointer-events: none;
    mix-blend-mode: screen;
    will-change: background-position;
  }
  /* 持续顶 hairline 流动 */
  .hairline-flow {
    position: absolute;
    left: 0; top: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      transparent 0%,
      transparent 30%,
      #FFE9A8 48%,
      #FFFFFF 50%,
      #FFE9A8 52%,
      transparent 70%,
      transparent 100%);
    background-size: 200% 100%;
    will-change: background-position;
    mix-blend-mode: screen;
  }
  /* ON AIR 红点呼吸 */
  .on-air-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #E62436;
    margin-right: 8px;
    vertical-align: 1px;
    box-shadow: 0 0 0 0 rgba(230,36,54,0.65);
  }

  /* 左：金边方块 label（无斜切） */
  .label-block {
    position: absolute;
    left: 28px; top: 38px;
    height: 90px;
    /* 自适应宽度 */
    padding: 0 32px;
    border: 2px solid #C8A654;
    background: rgba(200, 166, 84, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .label-block::before {
    content: '';
    position: absolute;
    left: -100%; top: 0; bottom: 0;
    width: 100%;
    background: #C8A654;
    z-index: 1;
  }
  .label-text {
    position: relative;
    z-index: 2;
    font-family: 'Oswald', sans-serif;
    font-size: 38px;
    color: #C8A654;
    letter-spacing: 4px;
    font-weight: 800;
    white-space: nowrap;
    line-height: 1;
  }

  /* 中部副标题（宋体 · 白色） */
  .sub-title-wrap {
    position: absolute;
    left: 0; right: 0; top: 38px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .sub-title {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 48px;
    color: #FFFFFF;
    letter-spacing: 3px;
    white-space: nowrap;
    line-height: 1;
    text-shadow: 0 0 24px rgba(200, 166, 84, 0.3);
  }
  .sub-title-cursor {
    display: inline-block;
    width: 4px;
    height: 48px;
    margin-left: 6px;
    background: #C8A654;
    vertical-align: middle;
    animation: blink 0.8s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 右：station 标识 */
  .station-block {
    position: absolute;
    right: 28px; top: 38px;
    height: 90px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-left: 1px solid rgba(200, 166, 84, 0.4);
  }
  .station-text {
    font-family: 'Oswald', sans-serif;
    font-size: 64px;
    color: #C8A654;
    font-weight: 800;
    letter-spacing: 5px;
    line-height: 1;
  }

  /* 主条：深灰底 */
  .main-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 200px;
    background: linear-gradient(180deg, #1A1F2E 0%, #0E1220 100%);
    border-top: 1px solid rgba(200, 166, 84, 0.5);
    overflow: hidden;
  }
  /* 装饰：左竖金条 */
  .main-bar::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(180deg, #C8A654 0%, #8F7434 100%);
  }

  .main-title-wrap {
    position: absolute;
    left: 60px; top: 0; bottom: 0;
    right: 320px;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .main-title {
    font-family: 'Noto Serif SC', 'Oswald', sans-serif;
    font-weight: 900;
    font-size: 64px;
    color: #FFFFFF;
    letter-spacing: 1px;
    white-space: nowrap;
    line-height: 1.05;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .main-title .char {
    display: inline-block;
    will-change: transform, opacity;
  }

  /* 右下时间码 */
  .time-stamp {
    position: absolute;
    right: 36px; top: 0; bottom: 0;
    display: flex;
    align-items: center;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .time-tick-label {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: rgba(200, 166, 84, 0.7);
    letter-spacing: 6px;
  }
  .time-tick-value {
    font-family: 'JetBrains Mono', 'Oswald', monospace;
    font-size: 56px;
    font-weight: 700;
    color: #C8A654;
    letter-spacing: 2px;
    line-height: 1;
    text-shadow: 0 0 18px rgba(200, 166, 84, 0.4);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div
  id="root"
  data-composition-id="main"
  data-start="0"
  data-duration="30"
  data-width="1242"
  data-height="1668"
  data-composition-variables='{
    "label": {"type":"string","default":"BREAKING"},
    "title_main": {"type":"string","default":"FUNNY ZOO SURVIVAL TIPS"},
    "title_sub": {"type":"string","default":"疯狂动物园避坑3招"},
    "station": {"type":"string","default":"ZNN"},
    "time_str": {"type":"string","default":"6:01 PM"}
  }'
>
  <div id="chyron">
    <div class="hairline" id="hairline"></div>
    <div class="sub-bar"></div>
    <div class="gloss-sub" id="gloss-sub"></div>
    <div class="hairline-flow" id="hairline-flow"></div>
    <div class="label-block" id="label-block">
      <div id="label-text" class="label-text">BREAKING</div>
    </div>
    <div class="sub-title-wrap">
      <div class="sub-title">
        <span id="sub-title-el">疯狂动物园避坑3招</span><span class="sub-title-cursor" id="sub-cursor"></span>
      </div>
    </div>
    <div class="station-block">
      <div id="station-text" class="station-text">ZNN</div>
    </div>
    <div class="main-bar">
      <div class="gloss-main" id="gloss-main"></div>
      <div class="main-title-wrap">
        <div id="main-title-el" class="main-title">FUNNY ZOO SURVIVAL TIPS</div>
      </div>
      <div class="time-stamp">
        <div class="time-tick-label"><span class="on-air-dot" id="on-air-dot"></span>ON AIR</div>
        <div class="time-tick-value" id="time-stamp-el">6:01 PM</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ===== 注入变量 =====
  const vars = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : {};
  if (vars.label)      document.getElementById('label-text').textContent = String(vars.label).toUpperCase();
  if (vars.title_sub)  document.getElementById('sub-title-el').textContent = vars.title_sub;
  if (vars.station)    document.getElementById('station-text').textContent = String(vars.station).toUpperCase();
  if (vars.time_str)   document.getElementById('time-stamp-el').textContent = vars.time_str;

  // 主标题字符拆分（用于 stagger 入场）
  const titleStr = (vars.title_main || 'FUNNY ZOO SURVIVAL TIPS').toString().toUpperCase();
  const titleEl = document.getElementById('main-title-el');
  titleEl.innerHTML = '';
  for (const ch of titleStr) {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch === ' ' ? ' ' : ch;
    titleEl.appendChild(span);
  }

  // ===== 标题 auto-fit · 超长则缩字号（修 Bug #2 中文长标题被裁） =====
  function autoFitText(el, maxFont, minFont, buffer) {
    if (!el) return;
    let size = maxFont;
    el.style.fontSize = size + 'px';
    while (size > minFont && el.scrollWidth > el.offsetWidth - (buffer || 0)) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }
  const _fit = () => {
    autoFitText(document.getElementById('main-title-el'), 64, 36, 8);
    autoFitText(document.getElementById('sub-title-el'),  48, 28, 6);
  };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(_fit);
  } else {
    setTimeout(_fit, 60);
  }
  _fit();

  // ===== GSAP timeline =====
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // 1. chyron 整体从下滑入
  tl.from('#chyron', { y: 367, duration: 0.55, ease: 'power3.out' }, 0);

  // 2. 顶金色 hairline 从左扫到右（先于其他元素）
  tl.from('#hairline', { scaleX: 0, duration: 0.7, ease: 'power2.inOut' }, 0.05);

  // 3. label 金色背景从左 wipe-in
  tl.to('#label-block::before', {}, 0); // placeholder
  tl.fromTo('.label-block', { borderColor: 'rgba(200,166,84,0.0)' },
    { borderColor: '#C8A654', duration: 0.4 }, 0.35);
  tl.from('#label-text', { opacity: 0, x: -16, duration: 0.45, ease: 'power2.out' }, 0.45);

  // 4. 副标题宋体淡入 + 光晕脉冲
  tl.from('#sub-title-el', { opacity: 0, y: 12, duration: 0.5 }, 0.5);

  // 5. station 字符 stagger 落下
  tl.from('.station-text', { opacity: 0, y: -24, duration: 0.5, ease: 'back.out(1.6)' }, 0.4);

  // 6. 主标题字符 stagger 弹入
  tl.from('.main-title .char', {
    opacity: 0, y: 28, duration: 0.45,
    stagger: { amount: 0.6, from: 'start' },
    ease: 'power3.out',
  }, 0.6);

  // 7. 时间码淡入
  tl.from('.time-stamp', { opacity: 0, scale: 0.7, duration: 0.5, ease: 'back.out(1.4)' }, 0.95);

  // ===== 持续流光（无限循环） =====
  gsap.set('#gloss-sub',     { backgroundPosition: '-120% 0%' });
  gsap.set('#gloss-main',    { backgroundPosition: '-130% 0%' });
  gsap.set('#hairline-flow', { backgroundPosition: '-100% 0%' });

  // sub-bar 金色流光：4.5s 一次
  tl.to('#gloss-sub', {
    backgroundPosition: '220% 0%',
    duration: 4.5, ease: 'sine.inOut',
    repeat: -1, repeatDelay: 1.0,
  }, 1.2);

  // main-bar 金色流光：5.5s 一次（错开节奏）
  tl.to('#gloss-main', {
    backgroundPosition: '240% 0%',
    duration: 5.5, ease: 'sine.inOut',
    repeat: -1, repeatDelay: 0.6,
  }, 1.6);

  // 顶 hairline 光点流动：3s 一次（快、亮）
  tl.to('#hairline-flow', {
    backgroundPosition: '200% 0%',
    duration: 3.0, ease: 'sine.inOut',
    repeat: -1, repeatDelay: 0.4,
  }, 1.0);

  // ON AIR 红点呼吸（持续）
  tl.to('#on-air-dot', {
    boxShadow: '0 0 0 10px rgba(230,36,54,0.0)',
    duration: 1.1, ease: 'sine.out',
    repeat: -1,
  }, 1.0);

  // 整体微呼吸（持续）— 让 chyron 不静止
  tl.to('#chyron', {
    keyframes: [
      { y: 0,    duration: 0 },
      { y: -2,   duration: 4, ease: 'sine.inOut' },
      { y: 0,    duration: 4, ease: 'sine.inOut' },
    ],
    repeat: -1,
  }, 1.5);

  // label 高光循环扫过（保留）
  tl.to('.label-block', {
    boxShadow: '0 0 28px rgba(200,166,84,0.55), inset 0 0 12px rgba(200,166,84,0.15)',
    duration: 1.6, repeat: -1, yoyo: true, ease: 'sine.inOut',
  }, 2);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
