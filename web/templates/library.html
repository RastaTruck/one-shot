{% extends "base.html" %}
{% block page_title %}素材库{% endblock %}
{% block stepper %}{% endblock %}

{% block content %}
<div x-data="libraryEdit()" x-init="init()" class="px-8 py-6 max-w-[1700px] mx-auto">

  <!-- 顶部 标题 + 操作 -->
  <section class="flex items-end justify-between mb-5">
    <div>
      <h1 class="font-display text-[28px] font-semibold tracking-tight text-ink-900">素材库</h1>
      <p class="mt-1 text-[12px] text-ink-500">
        共 <b class="text-ink-900" x-text="items.length"></b> · 已审 <b class="text-emerald-600" x-text="items.filter(i=>!i.needs_review).length"></b> · 待审 <b class="text-amber-600" x-text="items.filter(i=>i.needs_review).length"></b> · 筛后 <b class="text-ink-900" x-text="filtered.length"></b>
      </p>
    </div>
    <div class="flex items-center gap-2">
      <a href="/library/review"
         class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-[13px] font-medium flex items-center gap-1.5 transition">
        <i data-lucide="clipboard-check" class="w-3.5 h-3.5"></i>
        去审核 (<span x-text="items.filter(i=>i.needs_review).length"></span>)
      </a>
      <button @click="harvestOpen=true"
              class="px-3.5 py-2 rounded-xl bg-white border border-ink-200 hover:border-brand-300 text-[13px] font-medium text-ink-700 flex items-center gap-1.5 transition">
        <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i> 抓取一二布布
      </button>
      <button @click="bulkAutoLabel()" :disabled="selected.size===0"
              :class="selected.size>0 ? 'bg-ink-900 text-white' : 'bg-ink-100 text-ink-400 cursor-not-allowed'"
              class="px-3.5 py-2 rounded-xl text-[13px] font-medium flex items-center gap-1.5 transition">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        AI 打标 <span x-text="selected.size>0 ? '('+selected.size+')' : ''" class="text-[11px] opacity-70"></span>
      </button>
    </div>
  </section>

  <!-- 工具栏：搜索 + 筛选 -->
  <section class="bg-white border border-ink-200 rounded-xl p-3 mb-4 flex items-center gap-3 flex-wrap">
    <div class="relative">
      <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-ink-400"></i>
      <input type="text" placeholder="搜 ID / 描述 / 标签..." x-model="q"
             class="w-64 pl-9 pr-3 py-2 text-[12px] border border-ink-200 rounded-lg focus:border-brand-400 outline-none">
    </div>

    <div class="h-5 w-px bg-ink-200"></div>

    <div class="flex items-center gap-1">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-ink-500 mr-1">类型</span>
      <template x-for="k in ['all','expressions','elements','backgrounds','characters']" :key="k">
        <button @click="kindFilter=k; tagFilter=''"
                :class="kindFilter===k ? 'bg-ink-900 text-white' : 'bg-ink-50 text-ink-600 hover:bg-ink-100'"
                class="px-2.5 py-1 rounded text-[11px] font-medium">
          <span x-text="kindLabel(k)"></span>
        </button>
      </template>
    </div>

    <div class="h-5 w-px bg-ink-200"></div>

    <div class="flex items-center gap-1">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-ink-500 mr-1">IP</span>
      <button @click="ipFilter='all'"
              :class="ipFilter==='all' ? 'bg-brand-500 text-white' : 'bg-ink-50 text-ink-600 hover:bg-ink-100'"
              class="px-2.5 py-1 rounded text-[11px] font-medium">全部</button>
      <template x-for="ip in ips" :key="ip">
        <button @click="ipFilter=ip"
                :class="ipFilter===ip ? 'bg-brand-500 text-white' : 'bg-ink-50 text-ink-600 hover:bg-ink-100'"
                class="px-2.5 py-1 rounded text-[11px] font-medium" x-text="ip"></button>
      </template>
      <button @click="ipFilter='__none__'"
              :class="ipFilter==='__none__' ? 'bg-ink-900 text-white' : 'bg-ink-50 text-ink-600 hover:bg-ink-100'"
              class="px-2.5 py-1 rounded text-[11px] font-medium">未标</button>
    </div>

    <div class="h-5 w-px bg-ink-200"></div>

    <div class="flex items-center gap-1">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-ink-500 mr-1">格式</span>
      <template x-for="f in ['all','webp','gif']" :key="f">
        <button @click="fmtFilter=f"
                :class="fmtFilter===f ? 'bg-ink-900 text-white' : 'bg-ink-50 text-ink-600 hover:bg-ink-100'"
                class="px-2.5 py-1 rounded text-[11px] font-medium" x-text="f"></button>
      </template>
    </div>

    <div class="flex items-center gap-1 ml-auto">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-ink-500 mr-1">状态</span>
      <template x-for="s in [['reviewed','已审'],['pending','待审'],['all','全部']]" :key="s[0]">
        <button @click="reviewState=s[0]"
                :class="reviewState===s[0] ? (s[0]==='reviewed'?'bg-emerald-500 text-white':s[0]==='pending'?'bg-amber-500 text-white':'bg-ink-900 text-white') : 'bg-ink-50 text-ink-600 hover:bg-ink-100'"
                class="px-2.5 py-1 rounded text-[11px] font-medium" x-text="s[1]"></button>
      </template>
    </div>
  </section>

  <!-- 标签筛选（按层次分组） -->
  <section class="bg-white border border-ink-200 rounded-xl p-3 mb-3">
    <div class="flex items-start gap-2 flex-wrap">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-ink-500 mt-1 mr-1"
            x-text="kindFilter==='elements' ? '类别' : '情绪'"></span>
      <button @click="tagFilter=''"
              :class="tagFilter==='' ? 'bg-ink-900 text-white' : 'bg-white text-ink-600 border border-ink-200'"
              class="px-2.5 py-1 rounded text-[11px] font-medium">全部</button>

      <template x-for="g in activeGroups()" :key="g[0]">
        <div class="flex items-center gap-1 px-2 py-0.5 rounded-md border border-ink-100 bg-ink-50/40">
          <span class="text-[10px] font-semibold text-ink-500 mr-0.5" x-text="g[0]"></span>
          <template x-for="t in g[1]" :key="t">
            <button @click="tagFilter=t"
                    :class="tagFilter===t ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-ink-700 border-ink-200 hover:bg-amber-50'"
                    class="px-2 py-0.5 rounded text-[11px] font-medium border">
              <span x-text="'#'+t"></span>
            </button>
          </template>
        </div>
      </template>
    </div>

    <div class="flex items-center gap-2 mt-2 pt-2 border-t border-ink-100">
      <button @click="selectAllVisible()"
              class="px-2 py-0.5 rounded text-[10px] font-medium bg-white border border-ink-200 hover:border-ink-400 text-ink-600">
        全选可见 (<span x-text="filtered.length"></span>)
      </button>
      <button @click="clearSelection()" x-show="selected.size>0"
              class="px-2 py-0.5 rounded text-[10px] font-medium bg-white border border-ink-200 hover:border-ink-400 text-ink-600">
        清空选择 (<span x-text="selected.size"></span>)
      </button>
    </div>
  </section>

  <!-- 网格 -->
  <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-2.5">
    <template x-for="it in filtered.slice(0, displayLimit)" :key="it.id">
      <div class="group relative rounded-lg bg-white border transition overflow-hidden cursor-pointer"
           :class="selected.has(it.id) ? 'border-brand-500 ring-2 ring-brand-200' : 'border-ink-200 hover:border-brand-300'"
           @click.stop="toggleSelect(it.id, $event)">
        <!-- 选择 checkbox -->
        <div class="absolute top-1 left-1 z-10 w-5 h-5 rounded bg-white/80 border border-ink-300 flex items-center justify-center"
             :class="selected.has(it.id) ? 'bg-brand-500 border-brand-500' : ''">
          <i data-lucide="check" class="w-3 h-3 text-white" x-show="selected.has(it.id)"></i>
        </div>
        <!-- 待审 / 格式 / alpha 角标 -->
        <div class="absolute top-1 right-1 z-10 flex flex-col gap-0.5 items-end">
          <span x-show="it.needs_review" class="px-1 rounded bg-amber-500 text-white text-[8px] font-bold">待审</span>
          <span x-show="it.format" class="px-1 rounded bg-black/55 text-white text-[8px] font-mono" x-text="it.format"></span>
          <span x-show="it.has_alpha" class="px-1 rounded bg-emerald-500 text-white text-[8px] font-bold">α</span>
        </div>

        <div class="aspect-square bg-ink-100 overflow-hidden">
          <img :src="thumbSrc(it)" loading="lazy" class="w-full h-full object-cover" onerror="this.style.opacity=0.2">
        </div>
        <div class="p-1.5">
          <div class="text-[9px] font-mono text-ink-500 truncate" x-text="it.id"></div>
          <!-- 人工标 (情绪 or 类别) -->
          <template x-if="it.kind==='elements'">
            <div class="mt-0.5 flex flex-wrap gap-0.5" x-show="it.categories && it.categories.length">
              <template x-for="c in (it.categories||[]).slice(0,3)" :key="c">
                <span class="text-[8px] px-1 rounded bg-blue-50 text-blue-700 border border-blue-200" x-text="c"></span>
              </template>
            </div>
          </template>
          <template x-if="it.kind!=='elements'">
            <div class="mt-0.5 flex flex-wrap gap-0.5" x-show="it.scene_tags && it.scene_tags.length">
              <template x-for="t in (it.scene_tags||[]).slice(0,3)" :key="t">
                <span class="text-[8px] px-1 rounded bg-emerald-50 text-emerald-700 border border-emerald-200" x-text="'#'+t"></span>
              </template>
            </div>
          </template>
          <!-- AI 标 -->
          <template x-if="it.kind==='elements'">
            <div class="mt-0.5 flex flex-wrap gap-0.5" x-show="it.categories_ai && it.categories_ai.length">
              <template x-for="c in (it.categories_ai||[]).slice(0,3)" :key="'ai-'+c">
                <span class="text-[8px] px-1 rounded bg-amber-50 text-amber-700 border border-amber-200 italic" x-text="'AI:'+c"></span>
              </template>
            </div>
          </template>
          <template x-if="it.kind!=='elements'">
            <div class="mt-0.5 flex flex-wrap gap-0.5" x-show="it.scene_tags_ai && it.scene_tags_ai.length">
              <template x-for="t in (it.scene_tags_ai||[]).slice(0,3)" :key="'ai-'+t">
                <span class="text-[8px] px-1 rounded bg-amber-50 text-amber-700 border border-amber-200 italic" x-text="'AI:'+t"></span>
              </template>
            </div>
          </template>
        </div>
        <button @click.stop="openEdit(it)"
                class="absolute bottom-1 right-1 w-6 h-6 rounded bg-ink-900/80 text-white opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
          <i data-lucide="pencil" class="w-3 h-3"></i>
        </button>
      </div>
    </template>
  </div>
  <div x-show="filtered.length > displayLimit" class="text-center mt-4">
    <button @click="displayLimit += 200"
            class="px-4 py-2 text-[12px] rounded-lg bg-white border border-ink-200 hover:border-brand-300 text-ink-700">
      加载更多 (剩 <span x-text="filtered.length - displayLimit"></span>)
    </button>
  </div>
  <div x-show="filtered.length===0" class="text-center text-ink-400 py-16">
    无符合条件的素材
  </div>

  <!-- ============ 浮动批量操作栏 ============ -->
  <div x-show="selected.size>0" x-cloak
       class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-ink-900 text-white rounded-xl shadow-strong px-4 py-3 flex items-center gap-3">
    <span class="text-[12px] opacity-80">已选 <b x-text="selected.size"></b></span>
    <div class="h-5 w-px bg-white/20"></div>

    <!-- 批量改情绪标签 -->
    <div x-data="{open:false, tags:[]}" class="relative">
      <button @click="open=!open" class="px-2.5 py-1 rounded bg-white/10 hover:bg-white/20 text-[11px] flex items-center gap-1">
        <i data-lucide="tag" class="w-3 h-3"></i>
        <span x-text="$root.kindFilter==='elements' ? '设类别' : '设情绪标签'"></span>
      </button>
      <div x-show="open" @click.outside="open=false"
           class="absolute bottom-full mb-2 left-0 bg-white text-ink-800 rounded-lg shadow-strong p-3 w-[420px]">
        <div class="text-[10px] text-ink-500 mb-2"
             x-text="($root.kindFilter==='elements' ? '类别' : '情绪') + ' (多选 ≤5) —— 应用后覆盖 ' + tags.length + '/5'"></div>
        <div class="space-y-1.5 mb-3 max-h-72 overflow-auto">
          <template x-for="g in $root.activeGroups()" :key="g[0]">
            <div class="flex items-start gap-1.5">
              <span class="text-[10px] font-semibold text-ink-500 w-16 shrink-0 pt-1" x-text="g[0]"></span>
              <div class="flex flex-wrap gap-1 flex-1">
                <template x-for="t in g[1]" :key="t">
                  <button type="button" @click="
                    const i = tags.indexOf(t);
                    if (i >= 0) tags.splice(i, 1);
                    else if (tags.length < 5) tags.push(t);
                  "
                          :class="tags.includes(t) ? 'bg-amber-500 text-white border-amber-500' : 'bg-white border-ink-200 hover:bg-amber-50'"
                          class="text-[10px] px-1.5 py-0.5 rounded border">
                    <span x-text="$root.kindFilter==='elements' ? t : '#'+t"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>
        </div>
        <button @click="$root.kindFilter==='elements' ? $root.bulkSetCategories([...tags]) : $root.bulkSetTags([...tags]); tags=[]; open=false"
                class="w-full py-1.5 text-[11px] rounded bg-ink-900 text-white hover:bg-ink-800">应用</button>
      </div>
    </div>

    <!-- 批量改 IP -->
    <div x-data="{open:false}" class="relative">
      <button @click="open=!open" class="px-2.5 py-1 rounded bg-white/10 hover:bg-white/20 text-[11px] flex items-center gap-1">
        <i data-lucide="users" class="w-3 h-3"></i> 设 IP
      </button>
      <div x-show="open" @click.outside="open=false"
           class="absolute bottom-full mb-2 left-0 bg-white text-ink-800 rounded-lg shadow-strong py-1 min-w-[120px]">
        <button @click="$root.bulkSetIp('yierbubu'); open=false" class="w-full px-3 py-1.5 text-[11px] text-left hover:bg-ink-50">→ yierbubu</button>
        <button @click="$root.bulkSetIp('general'); open=false" class="w-full px-3 py-1.5 text-[11px] text-left hover:bg-ink-50">→ general</button>
        <button @click="$root.bulkSetIp(null); open=false" class="w-full px-3 py-1.5 text-[11px] text-left hover:bg-ink-50">清除 IP</button>
      </div>
    </div>

    <!-- 标记已审 -->
    <button @click="bulkMarkReviewed()" class="px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-700 text-[11px] flex items-center gap-1">
      <i data-lucide="check-check" class="w-3 h-3"></i> 标已审
    </button>

    <!-- 删除 -->
    <button @click="bulkDelete()" class="px-2.5 py-1 rounded bg-red-600 hover:bg-red-700 text-[11px] flex items-center gap-1">
      <i data-lucide="trash-2" class="w-3 h-3"></i> 删除
    </button>

    <button @click="clearSelection()" class="ml-2 text-[11px] opacity-60 hover:opacity-100">取消</button>
  </div>

  <!-- ============ 单条编辑 modal ============ -->
  <div x-show="editing" x-cloak
       class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
       @click.self="editing=null">
    <div class="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-auto" x-show="editing">
      <template x-if="editing">
        <div class="p-6">
          <div class="flex items-start gap-6 mb-5">
            <div class="w-48 h-48 bg-ink-100 rounded-xl overflow-hidden flex-shrink-0">
              <img :src="thumbSrc(editing)" class="w-full h-full object-contain">
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-[11px] font-mono text-ink-500" x-text="editing.id"></div>
              <div class="text-[13px] text-ink-700 mt-1" x-text="editing.kind+' · '+(editing.format||'?')+' · '+(editing.has_alpha?'透明':'非透明')"></div>
              <div class="text-[11px] text-ink-400 mt-1">来源: <span x-text="editing.source||'-'"></span></div>
              <div class="text-[11px] text-ink-400">原描述: <span x-text="editing.description||'(无)'"></span></div>
            </div>
            <button @click="editing=null" class="text-ink-400 hover:text-ink-700">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- AI 预测 -->
          <div x-show="editing.scene_tags_ai && editing.scene_tags_ai.length"
               class="mb-4 p-3 rounded-lg bg-amber-50 border border-amber-200">
            <div class="text-[11px] font-semibold text-amber-700 mb-1">AI 预测情绪</div>
            <div class="flex flex-wrap gap-1 mb-2">
              <template x-for="t in (editing.scene_tags_ai||[])" :key="t">
                <span class="px-2 py-0.5 rounded bg-white text-amber-700 text-[11px] border border-amber-300" x-text="'#'+t"></span>
              </template>
            </div>
            <div class="text-[10px] text-amber-700/80 italic" x-text="editing.scene_tags_ai_rationale"></div>
            <button @click="acceptAI()" class="mt-2 px-2 py-0.5 text-[10px] rounded bg-amber-500 text-white">采纳到最终标</button>
          </div>

          <!-- 情绪标签（仅 expressions/characters）-->
          <div class="mb-4" x-show="editing.kind!=='elements'">
            <div class="text-[11px] font-semibold text-ink-700 mb-2">情绪标签 (最多 5 个 · 最终消费字段)</div>
            <div class="space-y-2">
              <template x-for="g in tagGroups" :key="g[0]">
                <div class="flex items-start gap-2">
                  <span class="text-[10px] font-semibold text-ink-500 w-14 shrink-0 pt-1.5" x-text="g[0]"></span>
                  <div class="flex flex-wrap gap-1 flex-1">
                    <template x-for="t in g[1]" :key="t">
                      <label class="text-[11px] px-2 py-1 rounded cursor-pointer border"
                             :class="editing.scene_tags.includes(t) ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white border-ink-200 hover:border-emerald-300'">
                        <input type="checkbox" :value="t" @change="toggleEditTag(t)" class="hidden" :checked="editing.scene_tags.includes(t)">
                        <span x-text="'#'+t"></span>
                      </label>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- 元素类别（仅 elements · 多选 ≤5）-->
          <div class="mb-4" x-show="editing.kind==='elements'">
            <div class="flex items-center justify-between mb-2">
              <div class="text-[11px] font-semibold text-ink-700">场景类别 (多选 ≤5 · 最终消费字段)</div>
              <div class="text-[10px] text-ink-400" x-show="editing.categories">已选 <b x-text="(editing.categories||[]).length"></b>/5</div>
            </div>
            <!-- AI 预测 -->
            <div x-show="editing.categories_ai && editing.categories_ai.length"
                 class="mb-2 p-2 rounded bg-amber-50 border border-amber-200 flex items-center gap-2 flex-wrap">
              <span class="text-[10px] font-semibold text-amber-700">AI 预测:</span>
              <template x-for="c in (editing.categories_ai||[])" :key="c">
                <span class="px-1.5 py-0.5 rounded bg-white text-amber-700 text-[10px] border border-amber-300" x-text="c"></span>
              </template>
              <button @click="editing.categories = [...(editing.categories_ai||[])].slice(0,3)"
                      class="ml-auto px-2 py-0.5 text-[10px] rounded bg-amber-500 text-white">采纳</button>
            </div>
            <div class="space-y-1.5">
              <template x-for="g in categoryGroups" :key="g[0]">
                <div class="flex items-start gap-2">
                  <span class="text-[10px] font-semibold text-ink-500 w-16 shrink-0 pt-1" x-text="g[0]"></span>
                  <div class="flex flex-wrap gap-1 flex-1">
                    <template x-for="c in g[1]" :key="c">
                      <button @click="toggleEditCategory(c)"
                              :class="(editing.categories||[]).includes(c) ? 'bg-blue-500 text-white border-blue-500' : 'bg-white border-ink-200 hover:border-blue-300'"
                              class="text-[10px] px-1.5 py-0.5 rounded cursor-pointer border">
                        <span x-text="c"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- IP -->
          <div class="mb-4 grid grid-cols-2 gap-3">
            <label class="block">
              <div class="text-[11px] font-semibold text-ink-700 mb-1">IP 归属</div>
              <select x-model="editing.ip" class="w-full px-2 py-1.5 text-[12px] border border-ink-200 rounded">
                <option :value="null">(未标)</option>
                <option value="yierbubu">yierbubu</option>
                <option value="general">general</option>
              </select>
            </label>
            <label class="block">
              <div class="text-[11px] font-semibold text-ink-700 mb-1">强度 (1-3)</div>
              <input type="number" min="1" max="3" x-model.number="editing.intensity"
                     class="w-full px-2 py-1.5 text-[12px] border border-ink-200 rounded">
            </label>
          </div>

          <!-- 描述 -->
          <div class="mb-4">
            <div class="text-[11px] font-semibold text-ink-700 mb-1">描述</div>
            <textarea x-model="editing.description" rows="2"
                      class="w-full px-3 py-2 text-[12px] border border-ink-200 rounded resize-none"></textarea>
          </div>

          <div class="flex items-center justify-between pt-3 border-t border-ink-100">
            <button @click="deleteOne()" class="text-[12px] text-red-600 hover:text-red-700">删除这条</button>
            <div class="flex items-center gap-2">
              <button @click="editing=null" class="px-4 py-2 text-[12px] rounded-lg border border-ink-200 hover:bg-ink-50">取消</button>
              <button @click="saveEdit()" class="px-5 py-2 text-[12px] rounded-lg bg-ink-900 text-white hover:bg-ink-800">保存</button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ============ harvest modal ============ -->
  <div x-show="harvestOpen" x-cloak
       class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
       @click.self="harvestOpen=false">
    <div class="bg-white rounded-2xl w-full max-w-md p-6">
      <div class="flex items-start justify-between mb-4">
        <div>
          <h2 class="text-[16px] font-semibold text-ink-900">抓取一二布布素材</h2>
          <p class="text-[11px] text-ink-500 mt-0.5">从 Tenor 拉取 → 转 webp → 入库（待审）</p>
        </div>
        <button @click="harvestOpen=false" class="text-ink-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <label class="block mb-3">
        <div class="text-[11px] font-semibold text-ink-700 mb-1">搜索词（每行一个 · 留空用 12 个预设）</div>
        <textarea x-model="harvestQueries" rows="6" placeholder="一二布布&#10;bubu happy&#10;bubu sad"
                  class="w-full px-3 py-2 text-[12px] border border-ink-200 rounded font-mono"></textarea>
      </label>

      <div class="flex items-center gap-3 mb-4">
        <label class="flex-1">
          <div class="text-[11px] font-semibold text-ink-700 mb-1">每词数量</div>
          <input type="number" min="1" max="50" x-model.number="harvestLimit"
                 class="w-full px-2 py-1.5 text-[12px] border border-ink-200 rounded">
        </label>
        <label class="flex-1">
          <div class="text-[11px] font-semibold text-ink-700 mb-1">入库类型</div>
          <select x-model="harvestKind" class="w-full px-2 py-1.5 text-[12px] border border-ink-200 rounded">
            <option value="expressions">expressions（表情）</option>
            <option value="elements">elements（场景元素）</option>
          </select>
        </label>
      </div>

      <button @click="startHarvest()" :disabled="harvestRunning"
              :class="harvestRunning ? 'bg-ink-300 cursor-not-allowed' : 'bg-ink-900 hover:bg-ink-800'"
              class="w-full py-2.5 text-[13px] text-white rounded-lg font-medium">
        <span x-show="!harvestRunning">开始抓取</span>
        <span x-show="harvestRunning">抓取中...</span>
      </button>

      <div x-show="harvestProgress.length" class="mt-4 p-3 bg-ink-50 rounded-lg max-h-48 overflow-auto">
        <template x-for="p in harvestProgress" :key="p.query">
          <div class="text-[11px] text-ink-700 mb-0.5">
            <b x-text="p.query"></b> ·
            <span x-show="!p.error">抓 <span x-text="p.found"></span> 入库 <span x-text="p.new"></span></span>
            <span x-show="p.error" class="text-red-600" x-text="p.error"></span>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- AI 打标 进度 浮窗 -->
  <div x-show="labelTaskId && labelTask.status!=='succeeded'" x-cloak
       class="fixed top-20 right-6 z-40 bg-white border border-ink-200 rounded-xl shadow-strong p-4 w-72">
    <div class="flex items-center gap-2 mb-2">
      <i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i>
      <span class="text-[12px] font-semibold">AI 打标 · <span x-text="labelTask.status||'queued'"></span></span>
    </div>
    <div class="text-[11px] text-ink-500 mb-2">已处理 <b x-text="labelTask.progress?.length||0"></b> / <b x-text="labelTask.asset_ids?.length||0"></b></div>
    <div class="h-1.5 bg-ink-100 rounded-full overflow-hidden">
      <div class="h-full bg-amber-500 transition-all"
           :style="`width: ${(labelTask.progress?.length||0) / Math.max(labelTask.asset_ids?.length||1,1) * 100}%`"></div>
    </div>
  </div>

  <!-- toast -->
  <div x-show="toast" x-cloak x-transition.opacity
       class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg bg-ink-900 text-white text-[12px]"
       x-text="toast"></div>

</div>

<script>
function libraryEdit() {
  return {
    items: [],
    ips: [],
    sceneTags: {{ scene_tags_closed | tojson }},
    tagGroups: [],            // [["开心类", ["兴奋", ...]], ...]
    categoryGroups: [],       // [["内容主题", ["金融", ...]], ...]
    elementCategories: [],
    selected: new Set(),
    q: '', kindFilter: 'all', ipFilter: 'all', fmtFilter: 'all',
    tagFilter: '', reviewState: 'reviewed',  // 默认只看已审
    displayLimit: 200,
    editing: null,
    harvestOpen: false, harvestQueries: '', harvestLimit: 20, harvestKind: 'expressions',
    harvestRunning: false, harvestProgress: [], harvestTaskId: null,
    labelTaskId: null, labelTask: {},
    toast: null,

    async init() {
      await this.refresh();
      this.$nextTick(() => window.lucide && window.lucide.createIcons());
    },
    async refresh() {
      const r = await fetch('/api/library/list').then(r=>r.json());
      this.items = r.items || [];
      this.ips = r.ips || [];
      this.tagGroups = r.scene_tag_groups || [];
      this.categoryGroups = r.element_category_groups || [];
      this.elementCategories = r.element_categories_closed || [];
      this.$nextTick(() => window.lucide && window.lucide.createIcons());
    },
    activeGroups() {
      return this.kindFilter === 'elements' ? this.categoryGroups : this.tagGroups;
    },
    kindLabel(k) {
      return {all:'全部', expressions:'表情', elements:'元素', backgrounds:'背景', characters:'角色'}[k]||k;
    },
    thumbSrc(it) {
      if (!it.file) return '';
      if (it.file.startsWith('http')) return it.file;
      return '/' + it.file.replace(/^\//,'');
    },
    get filtered() {
      const q = this.q.trim().toLowerCase();
      return this.items.filter(it => {
        if (this.kindFilter !== 'all' && it.kind !== this.kindFilter) return false;
        if (this.ipFilter === '__none__' && it.ip) return false;
        else if (this.ipFilter !== 'all' && this.ipFilter !== '__none__' && it.ip !== this.ipFilter) return false;
        if (this.fmtFilter !== 'all' && it.format !== this.fmtFilter) return false;
        if (this.tagFilter) {
          if (this.kindFilter === 'elements') {
            if (!(it.categories||[]).includes(this.tagFilter)) return false;
          } else {
            if (!(it.scene_tags||[]).includes(this.tagFilter)) return false;
          }
        }
        if (this.reviewState === 'reviewed' && it.needs_review) return false;
        if (this.reviewState === 'pending' && !it.needs_review) return false;
        if (q) {
          const blob = (it.id+' '+(it.description||'')+' '+(it.tags||[]).join(' ')+' '+(it.scene_tags||[]).join(' ')).toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    },
    toggleSelect(id, ev) {
      if (this.selected.has(id)) this.selected.delete(id); else this.selected.add(id);
      this.selected = new Set(this.selected);
    },
    selectAllVisible() { this.filtered.forEach(it => this.selected.add(it.id)); this.selected = new Set(this.selected); },
    clearSelection() { this.selected = new Set(); },

    openEdit(it) {
      this.editing = JSON.parse(JSON.stringify(it));
      if (!this.editing.scene_tags) this.editing.scene_tags = [];
      this.$nextTick(() => window.lucide && window.lucide.createIcons());
    },
    toggleEditTag(t) {
      const i = this.editing.scene_tags.indexOf(t);
      if (i >= 0) this.editing.scene_tags.splice(i, 1);
      else if (this.editing.scene_tags.length < 5) this.editing.scene_tags.push(t);
      else this.showToast('最多 5 个');
    },
    toggleEditCategory(c) {
      if (!this.editing.categories) this.editing.categories = [];
      const i = this.editing.categories.indexOf(c);
      if (i >= 0) this.editing.categories.splice(i, 1);
      else if (this.editing.categories.length < 5) this.editing.categories.push(c);
      else this.showToast('最多 5 个');
    },
    acceptAI() {
      if (!this.editing.scene_tags_ai) return;
      this.editing.scene_tags = [...this.editing.scene_tags_ai].slice(0,3);
    },
    async saveEdit() {
      const e = this.editing;
      const r = await fetch('/api/library/'+encodeURIComponent(e.id), {
        method: 'PATCH', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          scene_tags: e.scene_tags,
          description: e.description,
          ip: e.ip,
          meta_patch: {intensity: e.intensity, categories: e.categories, needs_review: false},
        }),
      }).then(r=>r.json());
      if (r.ok) {
        this.showToast('已保存');
        this.editing = null;
        await this.refresh();
      } else this.showToast('保存失败');
    },
    async deleteOne() {
      if (!confirm('删除这条登记？(盘上文件不删)')) return;
      const r = await fetch('/api/library/'+encodeURIComponent(this.editing.id)+'/delete', {method:'POST'}).then(r=>r.json());
      if (r.ok) { this.editing = null; this.showToast('已删除'); await this.refresh(); }
    },

    async bulkSetTags(tags) {
      const updates = [...this.selected].map(id => ({asset_id: id, scene_tags: tags, meta_patch: {needs_review: false}}));
      await this.bulkPost(updates, '已批量改标签');
    },
    async bulkSetCategories(categories) {
      const updates = [...this.selected].map(id => ({asset_id: id, meta_patch: {categories: categories, needs_review: false}}));
      await this.bulkPost(updates, '已批量改类别');
    },
    async bulkSetIp(ip) {
      const updates = [...this.selected].map(id => ({asset_id: id, ip: ip}));
      await this.bulkPost(updates, '已批量改 IP');
    },
    async bulkMarkReviewed() {
      const updates = [...this.selected].map(id => ({asset_id: id, meta_patch: {needs_review: false}}));
      await this.bulkPost(updates, '已标记为已审');
    },
    async bulkPost(updates, msg) {
      const r = await fetch('/api/library/bulk_update', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({updates}),
      }).then(r=>r.json());
      if (r.ok) { this.showToast(msg + ` (${r.ok_count})`); this.clearSelection(); await this.refresh(); }
    },
    async bulkDelete() {
      if (!confirm(`删 ${this.selected.size} 条登记？(盘上文件不动)`)) return;
      for (const id of this.selected) {
        await fetch('/api/library/'+encodeURIComponent(id)+'/delete', {method:'POST'});
      }
      this.showToast('已删除 ' + this.selected.size);
      this.clearSelection();
      await this.refresh();
    },

    async bulkAutoLabel() {
      if (this.selected.size === 0) return;
      const ids = [...this.selected];
      const r = await fetch('/api/library/auto_label', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({asset_ids: ids}),
      }).then(r=>r.json());
      if (r.ok) {
        this.labelTaskId = r.task_id;
        this.pollLabel();
      }
    },
    async pollLabel() {
      if (!this.labelTaskId) return;
      const t = await fetch('/api/library/auto_label/'+this.labelTaskId).then(r=>r.json());
      this.labelTask = t;
      if (t.status === 'succeeded' || t.status === 'failed') {
        await this.refresh();
        if (t.status === 'succeeded') this.showToast('AI 打标完成');
        else this.showToast('AI 打标失败: ' + (t.error||''));
        setTimeout(() => { this.labelTaskId = null; }, 3000);
      } else {
        setTimeout(() => this.pollLabel(), 1500);
      }
    },

    async startHarvest() {
      this.harvestRunning = true;
      this.harvestProgress = [];
      const queries = this.harvestQueries.split('\n').map(s=>s.trim()).filter(Boolean);
      const body = {queries, limit: this.harvestLimit, kind: this.harvestKind};
      if (queries.length === 0) {
        // 用预设
        body.queries = ["一二布布","yierbubu","bubududu","bubu happy","bubu sad","bubu shocked","bubu angry","bubu confused","bubu thinking","bubu calm","bubu cute","bubu dudu"];
      }
      const r = await fetch('/api/library/harvest', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body),
      }).then(r=>r.json());
      if (r.ok) {
        this.harvestTaskId = r.task_id;
        this.pollHarvest();
      } else { this.harvestRunning = false; this.showToast('启动失败'); }
    },
    async pollHarvest() {
      if (!this.harvestTaskId) return;
      const t = await fetch('/api/library/harvest/'+this.harvestTaskId).then(r=>r.json());
      this.harvestProgress = t.progress || [];
      if (t.status === 'succeeded' || t.status === 'failed') {
        this.harvestRunning = false;
        await this.refresh();
        this.showToast(t.status === 'succeeded' ? `抓完 · ${t.registered} 入库` : '抓取失败');
      } else {
        setTimeout(() => this.pollHarvest(), 2000);
      }
    },

    showToast(msg) { this.toast = msg; setTimeout(() => this.toast = null, 2200); },
  };
}
</script>
{% endblock %}
