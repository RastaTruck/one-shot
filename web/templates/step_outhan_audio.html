{% extends "_outhan_layout.html" %}
{% block page_title %}配音 · {{ outhan_title or video_id }}{% endblock %}

{% block outhan_step_content %}
<div x-data="outhanAudio()" class="space-y-6">
  <div class="rounded-2xl bg-white border border-ink-200 p-6 shadow-soft">
    <h2 class="font-display text-[20px] font-semibold text-ink-900">步骤 5 · 配音</h2>
    <p class="mt-1 text-[13px] text-ink-500">
      先用 Gemini 按段写 Fish S1 配音稿，再用 Fish 合成音频。S1 规范：<code class="text-xs">(情绪)</code> 标签必须放句首。
    </p>
    <div class="mt-4 flex gap-3 flex-wrap">
      <button @click="generateScripts()" :disabled="genScripts || segments.length === 0"
              class="px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-[13px] font-bold transition disabled:opacity-50">
        <span x-text="genScripts ? 'Gemini 写稿中...' : (allHaveScript ? '重新生成所有段配音稿' : '用 Gemini 写所有段配音稿')"></span>
      </button>
      <button x-show="allHaveScript" x-cloak @click="synthAll()" :disabled="synthing"
              class="px-4 py-2 rounded-full bg-amber-500 hover:bg-amber-600 text-white text-[13px] font-bold transition disabled:opacity-50">
        <span x-text="synthing ? '全部合成中...' : '▶ 全部合成（Fish S1）'"></span>
      </button>
    </div>
    <div x-show="error" x-cloak class="mt-3 p-3 rounded-lg bg-red-50 border border-red-200 text-[13px] text-red-700"
         x-text="error"></div>
  </div>

  <div class="space-y-3">
    <template x-for="s in segments" :key="s.index">
      <div class="rounded-2xl bg-white border border-ink-200 p-5 shadow-soft">
        <div class="flex items-center justify-between mb-3">
          <span class="font-bold text-[15px] text-ink-900">段 <span x-text="s.index + 1"></span></span>
          <span class="px-2 py-0.5 rounded text-[11px] font-bold border"
                :class="s.audio_asset_id ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : (s.script ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-ink-100 text-ink-500 border-ink-200')"
                x-text="s.audio_asset_id ? '已合成' : (s.script ? '有稿待合成' : '无稿')"></span>
        </div>
        <label class="block text-[11px] font-bold text-ink-700 mb-1">Fish S1 配音稿</label>
        <textarea x-model="s.script" @blur="saveScript(s)" rows="3"
                  placeholder="例：(开心) 春天来了，万物生长。"
                  class="w-full px-3 py-2 rounded-lg border-2 border-ink-200 focus:border-blue-400 focus:outline-none text-[13px] font-mono"></textarea>
        <div class="mt-2 flex items-center gap-3">
          <button @click="synthOne(s.index)"
                  :disabled="synthing || !s.script || synthOneIdx === s.index"
                  class="px-3 py-1 rounded-full bg-white hover:bg-blue-50 border border-ink-200 hover:border-blue-400 text-[12px] font-bold text-ink-700 disabled:opacity-50">
            <span x-text="synthOneIdx === s.index ? '合成中...' : (s.audio_asset_id ? '重新合成' : '合成')"></span>
          </button>
          <audio x-show="s.audio_asset_id" x-cloak controls
                 :src="`/api/outhan/${videoId}/asset/${s.audio_asset_id}`"
                 class="flex-1 max-w-md"></audio>
        </div>
      </div>
    </template>
  </div>

  <div class="flex justify-between gap-3">
    <a href="/project/{{ video_id }}/outhan/video"
       class="px-4 py-2 rounded-full border border-ink-200 hover:border-blue-400 text-[13px] font-bold text-ink-700">
      ← 步骤 4 · 分段视频
    </a>
    <button @click="next()" :disabled="!allHaveAudio"
            class="px-5 py-2.5 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-[13px] transition disabled:opacity-50">
      进入步骤 6 · 打包 →
    </button>
  </div>
</div>

<script>
function outhanAudio() {
  return {
    videoId: {{ video_id|tojson }},
    segments: {{ segments|tojson }},
    genScripts: false, synthing: false, synthOneIdx: null,
    error: null,
    get allHaveScript() { return this.segments.length > 0 && this.segments.every(s => !!(s.script && s.script.trim())); },
    get allHaveAudio() { return this.segments.length > 0 && this.segments.every(s => !!s.audio_asset_id); },

    async refresh() {
      try {
        const res = await fetch(`/api/outhan/${this.videoId}/segments`);
        if (!res.ok) return;
        const d = await res.json(); this.segments = d.segments;
      } catch {}
    },

    async generateScripts() {
      this.genScripts = true; this.error = null;
      try {
        const res = await fetch(`/api/outhan/${this.videoId}/generate-all-scripts`, {method:'POST'});
        if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.error || res.status); }
        await this.refresh();
      } catch (e) { this.error = e.message || String(e); }
      finally { this.genScripts = false; }
    },

    async saveScript(s) {
      try {
        await fetch(`/api/outhan/${this.videoId}/segment/${s.index}`, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({script: s.script}),
        });
      } catch {}
    },

    async synthOne(idx) {
      this.synthOneIdx = idx; this.error = null;
      try {
        await this.saveScript(this.segments.find(s => s.index === idx));
        const res = await fetch(`/api/outhan/${this.videoId}/segment/${idx}/synthesize`, {method:'POST'});
        if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.error || res.status); }
        await this.refresh();
      } catch (e) { this.error = `段 ${idx+1}: ${e.message || e}`; }
      finally { this.synthOneIdx = null; }
    },

    async synthAll() {
      this.synthing = true; this.error = null;
      try {
        // 先存
        for (const s of this.segments) await this.saveScript(s);
        for (const s of this.segments) {
          if (!s.script || !s.script.trim()) continue;
          const res = await fetch(`/api/outhan/${this.videoId}/segment/${s.index}/synthesize`, {method:'POST'});
          if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(`段 ${s.index+1}: ${d.error || res.status}`); }
          await this.refresh();
        }
      } catch (e) { this.error = e.message || String(e); }
      finally { this.synthing = false; }
    },

    async next() {
      try {
        await fetch(`/api/outhan/${this.videoId}/advance-step`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({to: 6}),
        });
        window.location.href = `/project/${this.videoId}/outhan/package`;
      } catch (e) { this.error = e.message; }
    },
  };
}
</script>
{% endblock %}
