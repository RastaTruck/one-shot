<!-- 流水线进度条 · 真相源：pipeline/flow.py compute_progress -->
<div class="glass border-b border-ink-200 px-8 py-5">
  <div class="flex items-center max-w-4xl mx-auto">
    {% for sv in steps_view %}
      {% set active = (active_nav == sv.key) %}
      <a href="{{ sv.url }}"
         class="flex items-center gap-2 shrink-0 group"
         {% if sv.blocker %}title="{{ sv.blocker }}"{% endif %}>
        <div class="relative w-9 h-9 rounded-full flex items-center justify-center text-[12px] font-semibold transition
                    {% if active %}bg-ink-900 text-white shadow-medium ring-[3px] ring-brand-200
                    {% elif sv.done %}bg-gradient-to-br from-brand-400 to-brand-600 text-white shadow-soft
                    {% elif sv.is_current %}bg-white border-2 border-brand-500 text-brand-700
                    {% else %}bg-white border border-ink-200 text-ink-400{% endif %}">
          {% if sv.done and not active %}<i data-lucide="check" class="w-4 h-4"></i>{% else %}{{ loop.index }}{% endif %}
        </div>
        <div class="text-[12px] leading-tight
                    {% if active %}text-ink-900 font-semibold
                    {% elif sv.done %}text-ink-700 font-medium
                    {% elif sv.is_current %}text-brand-700 font-medium
                    {% else %}text-ink-400{% endif %}">
          {{ sv.label_short }}
        </div>
      </a>
      {% if not loop.last %}
        <div class="stepper-line mx-3 {% if sv.done %}done{% endif %}"></div>
      {% endif %}
    {% endfor %}
  </div>
</div>
