{# 下一步按钮 · 真相源：build_ctx 注入的 next_step_url / next_step_label / can_advance / current_blocker
   不允许在任何 step_*.html 里 hard-code 跳到下一步的 URL。所有"前往下一步"按钮统一 include 本文件。 #}
{% if next_step_url %}
  {% if can_advance %}
    <a href="{{ next_step_url }}" class="btn-primary text-[12px] inline-flex items-center gap-1">
      下一步：{{ next_step_label }}
      <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
    </a>
  {% else %}
    <span class="btn-primary text-[12px] inline-flex items-center gap-1 opacity-50 cursor-not-allowed"
          title="{{ current_blocker or '当前步骤未完成' }}"
          aria-disabled="true">
      下一步：{{ next_step_label }}
      <i data-lucide="lock" class="w-3.5 h-3.5"></i>
    </span>
  {% endif %}
{% endif %}
